modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/sugarplum-studios/pinkified-minecraft/issues"

# Every feature of Pinkified is cosmetic and client-side. Servers never need it,
# and clients with it can join any server. The mod class only loads on the client.
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
logoFile="pinkified_logo.png"
logoBlur=false
credits="${credits}"
authors="${mod_author}"
description='''${description}'''

# Container decorations and the game-over screen (shared with Fabric).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
