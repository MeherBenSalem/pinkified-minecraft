modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/sugarplum-studios/pinkified-minecraft/issues"
# Every feature of Pinkified is cosmetic and client-side. Servers never need it,
# and clients with it can join any server (vanilla, Forge, or modded).
clientSideOnly=true
accessTransformers=[]

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="pinkified_logo.png"
logoBlur=false
credits="Made with love by Sugarplum Studios. All textures, music and sounds are original."
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
