plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // @Nullable in the shared code (Forge and NeoForge put JSR-305 on the classpath, Fabric does not)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        // Pinkified is client-only; this run checks that a dedicated server starts cleanly with it installed.
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // Developer visual check: walks through the themed menus and screens, saves screenshots to
        // runs/snapshots/screenshots/pinkified_*.png and quits. See DevSnapshots.java.
        snapshots {
            client()
            setConfigName('Fabric Snapshots')
            ideConfigGenerated(false)
            runDir('runs/snapshots')
            vmArg('-Dpinkified.devshots=true')
            programArgs('--width', '1920', '--height', '1080')
        }
    }
}
