plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        // Pinkified is client-only; this run checks that a dedicated server starts cleanly with it installed.
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        // Developer visual check: walks through the themed menus and screens, saves screenshots to
        // runs/snapshots/screenshots/pinkified_*.png and quits. See DevSnapshots.java.
        snapshots {
            client()
            gameDirectory = project.file('runs/snapshots')
            systemProperty 'pinkified.devshots', 'true'
            programArguments.addAll '--width', '1920', '--height', '1080'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // @Nullable in the common code; Forge's userdev does not bring it (the common project gets it from mcp_config).
    compileOnly 'org.jetbrains:annotations:24.0.1'
}

jar {
    finalizedBy('reobfJar')
}
