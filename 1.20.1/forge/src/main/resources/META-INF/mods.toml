modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/sugarplum-studios/pinkified-minecraft/issues"
# Every feature of Pinkified is cosmetic and client-side. Servers never need it,
# and clients with it can join any server (vanilla, Forge, or modded).
clientSideOnly=true
accessTransformers=[]

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
logoFile="pinkified_logo.png"
logoBlur=false
credits="${credits}"
authors="${mod_author}"
displayTest="IGNORE_ALL_VERSION"
description='''${description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
