# Scratch workflow for the marketing kit: runs the snapshot harness at 1920x1080 and commits the captures to this
# branch so they can be fetched with git. Lives only on ci/marketing-screenshots and is never merged.
name: Capture marketing screenshots
on:
  push:
    branches: ["ci/marketing-screenshots"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - run: chmod +x gradlew
      - timeout-minutes: 30
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" ./gradlew runSnapshots --stacktrace
      - name: Commit the captures
        run: |
          mkdir -p captures && cp run/screenshots/pinkified_*.png captures/
          ls -la captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures && git commit -m "Snapshot captures for the marketing kit" && git push
