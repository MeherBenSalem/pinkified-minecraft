# Builds the Forge 1.20.1 jar and checks that it runs: a real Forge dedicated server booted with the built jar
# (scripts/server-boot-test.sh), and a real client that walks through every themed screen, screenshots it and quits
# (runSnapshots). Pinkified is client-only and adds nothing to the server side, so it has no GameTests. Runs on pull
# requests, by hand, and from the Build release jar workflow. It never publishes anything.

name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Check the jar
        run: |
          set -e
          V=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          name="pinkified-forge-$MC-$V.jar"
          jar="build/libs/$name"
          ls -la build/libs
          [ -f "$jar" ] || { echo "Missing $jar"; exit 1; }
          dir=$(mktemp -d); unzip -q "$jar" -d "$dir"
          grep -q "Implementation-Version: $V" "$dir/META-INF/MANIFEST.MF" || { echo "Manifest is not $V"; exit 1; }
          grep -q 'modId="pinkified"' "$dir/META-INF/mods.toml" || { echo "mods.toml has no pinkified"; exit 1; }
          grep -q "version=\"$V\"" "$dir/META-INF/mods.toml" || { echo "mods.toml version is not $V"; exit 1; }
          grep -q '^clientSideOnly=true' "$dir/META-INF/mods.toml" || { echo "mods.toml is not client side only"; exit 1; }
          grep -q 'displayTest="IGNORE_ALL_VERSION"' "$dir/META-INF/mods.toml" || { echo "mods.toml displayTest changed"; exit 1; }
          [ -f "$dir/com/sugarplumstudios/pinkified/PinkifiedMod.class" ] || { echo "No PinkifiedMod class"; exit 1; }
          [ -f "$dir/pinkified_logo.png" ] || { echo "No mod list logo"; exit 1; }
          [ -f "$dir/assets/pinkified/sounds/music/sugarplum_lullaby.ogg" ] || { echo "No menu music"; exit 1; }
          find "$dir/com" -name '*.class' -exec strings {} + | grep -q -E '^(m|f)_[0-9]+_$' || { echo "The jar is not SRG-mapped"; exit 1; }
          echo "OK $name $(stat -c %s "$jar") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/pinkified-forge-*.jar

  server-test:
    name: Server boot test with the built jar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: jar
      - run: chmod +x scripts/server-boot-test.sh
      - name: Boot a Forge server with the jar installed
        timeout-minutes: 15
        run: scripts/server-boot-test.sh jar/pinkified-forge-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-boot-test
          path: |
            build/boot-test-server/boot.log
            build/boot-test-server/logs/**
            build/boot-test-server/crash-reports/**
          if-no-files-found: ignore

  client-test:
    name: Client launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - run: chmod +x gradlew
      - name: Launch the client, screenshot every themed screen and quit
        timeout-minutes: 30
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" sh -c 'glxinfo -B | head -20; ./gradlew runSnapshots --stacktrace'
      - name: Check the screenshots and the log
        run: |
          set -e
          ls -la run/screenshots || true
          n=$(ls run/screenshots/pinkified_*.png 2>/dev/null | wc -l)
          echo "$n snapshot screenshots"
          [ ! -d run/crash-reports ] || { head -150 run/crash-reports/*.txt; exit 1; }
          [ "$n" -ge 31 ] || { echo "Expected 31 snapshot screenshots"; exit 1; }
          grep -q "\[devshots\] finished, quitting" run/logs/latest.log || { echo "The snapshot harness did not finish"; exit 1; }
          if grep -E "ERROR|Exception|Caused by" run/logs/latest.log | grep -E 'com.sugarplumstudios|pinkified([^-.a-z]|$)|devshots'; then echo "The log has errors naming Pinkified"; exit 1; fi
      - name: Errors in the log
        if: always()
        run: grep -n -E "ERROR|Exception|Caused by|at com\.sugarplum" run/logs/latest.log | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test
          path: |
            run/screenshots/**
            run/logs/latest.log
            run/crash-reports/**
          if-no-files-found: ignore
